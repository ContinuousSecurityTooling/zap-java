name: Create release
run-name: Release ${{ inputs.release_type == 'custom' && inputs.custom_version || inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build'
        type: choice
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false

jobs:
  release:
    uses: m13tLabs/gh-actions-templates/.github/workflows/maven-release.yml@main
    with:
      release_type: ${{ inputs.release_type }}
      custom_version: ${{ inputs.custom_version }}
      client_id: ${{ vars.CI_CLIENT_ID }}
      java_version: '25.0.4+101.0.LTS'
      maven_args: '-Pcentral-publish -DskipTests -DskipITs'
    secrets: inherit
